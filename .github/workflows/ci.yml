name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # --------------------------------------------------
  # 1. Test application
  # --------------------------------------------------

  test:
    name: Test application

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # --------------------------------------------------
  # 2. Build and push Docker image to ECR
  # --------------------------------------------------

  docker-build:
    name: Build and push Docker image

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs:
      - test

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-south-1


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        run: |
          docker build \
            -t cloud-dashboard:${{ github.sha }} \
            ./app


      - name: Tag Docker image
        run: |
          docker tag \
            cloud-dashboard:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/ssd-github-actions-eks:${{ github.sha }}


      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/ssd-github-actions-eks:${{ github.sha }}


  # --------------------------------------------------
  # 3. Deploy to EKS
  # --------------------------------------------------

  deploy:
    name: Deploy to EKS

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-south-1


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name "${{ vars.EKS_CLUSTER_NAME }}"


      - name: Verify EKS connection
        run: |
          kubectl get nodes


      - name: Update image in deployment
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|${{ needs.docker-build.outputs.registry }}/ssd-github-actions-eks:${{ github.sha }}|g" \
            k8s/deployment.yaml


      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/cloud-dashboard


      - name: Verify deployment
        run: |
          kubectl get deployment cloud-dashboard
          kubectl get pods -l app=cloud-dashboard
          kubectl get service cloud-dashboard
