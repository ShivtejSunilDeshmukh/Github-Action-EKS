apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-dashboard

  template:
    metadata:
      labels:
        app: cloud-dashboard

    spec:
      containers:
        - name: cloud-dashboard

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
